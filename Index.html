          <div class="field"><label>Kho Tiên Sa MT</label><input type="text" inputmode="decimal" class="num-fmt" id="e-tienSaMT" value="${esc(r.tienSaMT)}"></div>
          <div class="field"><label>Kho Tiên Sa BDMT</label><input type="text" inputmode="decimal" class="num-fmt" id="e-tienSaBDMT" value="${esc(r.tienSaBDMT)}"></div>
          <div class="field"><label>Kho Dung Quất MT</label><input type="text" inputmode="decimal" class="num-fmt" id="e-dungQuatMT" value="${esc(r.dungQuatMT)}"></div>
          <div class="field"><label>Kho Dung Quất BDMT</label><input type="text" inputmode="decimal" class="num-fmt" id="e-dungQuatBDMT" value="${esc(r.dungQuatBDMT)}"></div>
        </div>
        <div class="grid cols-3">
          <div class="field"><label>Điều chỉnh</label><input type="text" inputmode="decimal" class="num-fmt" id="e-dieuChinh" value="${esc(r.dieuChinh)}"></div>
          <div class="field"><label>Mượn/trả</label><input type="text" inputmode="decimal" class="num-fmt" id="e-muonTra" value="${esc(r.muonTra)}"></div>
          <div class="field"><label>Nhập gỗ keo</label><input type="text" inputmode="decimal" class="num-fmt" id="e-nhapGo" value="${esc(r.nhapGo)}"></div>
        </div>
        <div class="hint-text">Các cột tính tự động (Cộng MT/BDMT, Độ ẩm, Tồn kho CK) sẽ tự cập nhật lại theo công thức sẵn có trong Sheet sau khi lưu.</div>
      </div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Hủy</button>
        <button class="btn primary" onclick="saveHistoryEdit(${rowIndex})">💾 Lưu thay đổi</button></div>
    `);
    attachNumberFormatting_();
  });
}

function saveHistoryEdit(rowIndex){
  const g = id => document.getElementById(id).value;
  const n = getNumFieldValue_;
  const updates = {
    donVi: g('e-donVi'), ngayTonKho: g('e-ngayTonKho'), tonDauNgay: n('e-tonDauNgay'),
    hoaNhonMT: n('e-hoaNhonMT'), hoaNhonBDMT: n('e-hoaNhonBDMT'),
    queSonMT: n('e-queSonMT'), queSonBDMT: n('e-queSonBDMT'),
    daiHiepMT: n('e-daiHiepMT'), daiHiepBDMT: n('e-daiHiepBDMT'),
    hakqnMT: n('e-hakqnMT'), hakqnBDMT: n('e-hakqnBDMT'),
    tienSaMT: n('e-tienSaMT'), tienSaBDMT: n('e-tienSaBDMT'),
    dungQuatMT: n('e-dungQuatMT'), dungQuatBDMT: n('e-dungQuatBDMT'),
    dieuChinh: n('e-dieuChinh'), muonTra: n('e-muonTra'), nhapGo: n('e-nhapGo')
  };
  call('updateEntry', [rowIndex, updates], 'Đang lưu...').then(res => {
    if (handleResult(res)) { closeModal(); loadHistory(); }
  });
}

function confirmDeleteHistory(rowIndex){
  if (!confirm('Xóa báo cáo này khỏi lịch sử? Hành động không thể hoàn tác.')) return;
  call('deleteEntry', [rowIndex], 'Đang xóa...').then(res => handleResult(res, loadHistory));
}

/** Duyệt/Từ chối báo cáo "Chờ duyệt" (lệch đầu kỳ và/hoặc lệch định
 * mức) ngay tại Lịch Sử (mục X, v2026.8.17, CHỈ Admin thấy nút này) -
 * gọi duyetBaoCao(rowIndex, chapNhan) ở Code.gs, tự đồng bộ lại
 * Chitiettonkho + báo email cho người nộp. */
function duyetBaoCaoLichSu(rowIndex, chapNhan){
  const hanhDong = chapNhan ? 'DUYỆT' : 'TỪ CHỐI';
  if (!confirm(`${hanhDong} báo cáo này?` + (chapNhan ? '' : '\nNgười nộp sẽ cần nộp lại báo cáo khác.'))) return;
  call('duyetBaoCao', [rowIndex, chapNhan], 'Đang xử lý...').then(res => handleResult(res, () => { loadHistory(); loadSoLuongChoDuyet(); }));
}

/** Tải + hiện số badge "Chờ duyệt" ở menu Lịch Sử (mục AD, v2026.8.18) -
 * gọi lúc khởi động, sau khi nộp báo cáo mới, và sau khi Duyệt/Từ chối
 * (số lượng có thể đổi sau các hành động này). Badge tự ẩn khi = 0. */
function loadSoLuongChoDuyet(){
  call('getSoLuongChoDuyet', [], null).then(n => {
    state.soLuongChoDuyet = n || 0;
    const el = document.getElementById('nav-choduyet-badge');
    if (!el) return;
    el.textContent = state.soLuongChoDuyet > 99 ? '99+' : String(state.soLuongChoDuyet);
    el.classList.toggle('hidden', state.soLuongChoDuyet === 0);
  }).catch(() => {});
}

/* ============================================================
 * BÁO CÁO TỔNG HỢP (2 tab: theo khoảng thời gian tự tổng hợp, và theo
 * đúng mẫu "Tonkho_Damgo" cho 1 ngày cụ thể - mục G ở đầu Code.gs)
 * ============================================================ */
function renderReport(){
  const today = new Date();
  const toISO = d => d.toISOString().slice(0,10);
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn" onclick="exportReportToExcel()">⬇️ Xuất Excel</button>
    <button class="btn" onclick="exportReportToPdf()">🖨️ Xuất PDF</button>`;
  // THEO YÊU CẦU MỚI (mục X, v2026.8.17): người dùng thường chỉ thấy Đơn
  // vị mình có quyền (Nhập/Sửa hoặc Xem) ở bộ lọc báo cáo - Admin đủ 4.
  const unitOptions = state.isAdmin ? (state.units.length ? state.units : []) : myUnitOptions(false);
  // THEO YÊU CẦU MỚI (mục AB, v2026.8.17): mặc định chọn SẴN Đơn vị
  // được phân quyền (xem ghi chú tương tự ở renderHistory) khi CHỈ có
  // đúng 1 Đơn vị được phép.
  const defaultDonVi = (!state.isAdmin && unitOptions.length === 1) ? unitOptions[0] : '';
  // THEO YÊU CẦU MỚI (mục L, v2026.8.17): ngày mặc định của báo cáo
  // "Theo mẫu Tonkho_Damgo" là HÔM QUA (lùi 1 ngày so với hiện hành) -
  // vì các đơn vị thường báo cáo cho ngày hôm trước, mặc định "hôm nay"
  // hay bị trống dữ liệu ngay lần đầu mở báo cáo.
  if (!state.tonkhoDamgoDate) {
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    state.tonkhoDamgoDate = toISO(yesterday);
  }
  if (!state.tonkhoDamgoMode) state.tonkhoDamgoMode = 'actual';
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="card no-print" style="padding:8px;display:flex;gap:6px">
      <button class="btn sm report-tab-btn ${state.reportTab==='period'?'primary':''}" data-tab="period" onclick="switchReportTab('period')">📅 Theo khoảng thời gian</button>
      <button class="btn sm report-tab-btn ${state.reportTab==='tonkhodamgo'?'primary':''}" data-tab="tonkhodamgo" onclick="switchReportTab('tonkhodamgo')">📄 Theo mẫu Tonkho_Damgo</button>
    </div>

    <div id="report-period-section" class="${state.reportTab==='period'?'':'hidden'}">
      <div class="card no-print">
        <div class="grid cols-4">
          <div class="field"><label>Đơn vị</label>
            <select id="rp-donVi"><option value="" ${defaultDonVi?'':'selected'}>-- Tất cả --</option>${unitOptions.map(u=>`<option value="${esc(u)}" ${u===defaultDonVi?'selected':''}>${esc(u)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Từ ngày</label><input type="date" id="rp-from" value="${toISO(today)}"></div>
          <div class="field"><label>Đến ngày</label><input type="date" id="rp-to" value="${toISO(today)}"></div>
          <div class="field" style="display:flex;align-items:flex-end"><button class="btn primary" onclick="loadReport()">🔍 Xem báo cáo</button></div>
        </div>
        <div class="grid cols-4" style="margin-top:8px">
          <div class="field"><label>Nhà máy (chi tiết theo ngày)</label>
            <select id="rp-nhaMay">
              <option value="">-- Cả 4 nhà máy --</option>
              <option value="hoaNhon">Hòa Nhơn</option>
              <option value="queSon">Quế Sơn</option>
              <option value="daiHiep">Đại Hiệp</option>
              <option value="hakqn">HAKQN</option>
            </select>
          </div>
        </div>
        <div class="hint-text">Dữ liệu lấy từ Chitiettonkho (đã lọc trùng, mỗi Đơn vị+Ngày 1 bản ghi mới nhất). Tồn đầu kỳ lấy từ ngày sớm nhất trong khoảng lọc, Tồn cuối kỳ lấy từ ngày mới nhất trong khoảng lọc. Bảng "Chi tiết theo Nhà máy" bên dưới hiển thị TỪNG NGÀY (không gộp cuối kỳ) và lọc riêng theo 1 trong 4 nhà máy nếu chọn ở đây - THEO YÊU CẦU MỚI (mục V).</div>
      </div>
      <div class="card" id="report-wrap"><div class="empty"><div class="ic">📊</div>Chọn khoảng ngày rồi bấm "Xem báo cáo".</div></div>
    </div>

    <div id="report-tonkhodamgo-section" class="${state.reportTab==='tonkhodamgo'?'':'hidden'}">
      <div class="card no-print">
        <div class="grid cols-4">
          <div class="field"><label>Ngày tồn kho báo cáo</label><input type="date" id="tkd-ngay" value="${esc(state.tonkhoDamgoDate)}"></div>
          <div class="field"><label>Chế độ hiển thị</label>
            <div style="display:flex;gap:6px">
              <button class="btn sm tkd-mode-btn ${state.tonkhoDamgoMode==='actual'?'primary':''}" data-mode="actual" onclick="switchTonkhoDamgoMode('actual')">📋 Theo thực tế</button>
              <button class="btn sm tkd-mode-btn ${state.tonkhoDamgoMode==='full'?'primary':''}" data-mode="full" onclick="switchTonkhoDamgoMode('full')">🧩 Đầy đủ số liệu</button>
            </div>
          </div>
          <div class="field" style="display:flex;align-items:flex-end;gap:6px">
            <button class="btn primary" onclick="loadTonkhoDamgoReport()">🔍 Xem báo cáo</button>
            <button class="btn accent admin-only ${state.isAdmin?'':'hidden'}" onclick="guiBaoCaoTonkhoDamgoTelegramDotXuat()">📨 Gửi báo cáo Telegram</button>
          </div>
        </div>
        <div class="hint-text">Dựng lại đúng cấu trúc bảng của sheet "Tonkho_Damgo" (NHÀ MÁY / KHO XUẤT HÀNG / ĐỊNH MỨC SX) cho 1 ngày cụ thể, dữ liệu lấy từ Chitiettonkho. "Theo thực tế" (mặc định) - đơn vị chưa báo cáo đúng ngày này hiển thị 0. "Đầy đủ số liệu" - đơn vị chưa báo cáo đúng ngày này tự lấy tạm số liệu ngày gần nhất trước đó, có ghi chú rõ ràng. Nút "Gửi báo cáo Telegram" (chỉ Admin) gửi ngay báo cáo của đúng ngày + chế độ đang xem vào Telegram (kèm 2 file PDF - Theo thực tế và Đầy đủ số liệu, mẫu cũ) - khác với ảnh tóm tắt Trang chủ (nút riêng ở Trang chủ > Công cụ Admin, chỉ gửi tự động 16h hoặc bấm thủ công ở đó).</div>
      </div>
      <div class="card" id="tkd-wrap"><div class="empty"><div class="ic">📄</div>Chọn ngày rồi bấm "Xem báo cáo".</div></div>
    </div>`;

  if (!state.units.length) call('getUnitList', [], null).then(list => { state.units = list; });
  if (state.reportTab === 'tonkhodamgo' && document.getElementById('tkd-ngay').value) loadTonkhoDamgoReport();
  // THEO YÊU CẦU MỚI (mục AB, v2026.8.17): người dùng chỉ được cấp
  // đúng 1 Đơn vị thì tự động xem luôn báo cáo Đơn vị đó, đỡ phải bấm
  // "Xem báo cáo" thêm 1 lần khi Đơn vị đã chọn sẵn.
  if (state.reportTab === 'period' && defaultDonVi) loadReport();
}

function switchReportTab(tab){
  state.reportTab = tab;
  document.getElementById('report-period-section').classList.toggle('hidden', tab!=='period');
  document.getElementById('report-tonkhodamgo-section').classList.toggle('hidden', tab!=='tonkhodamgo');
  document.querySelectorAll('.report-tab-btn').forEach(b => b.classList.toggle('primary', b.dataset.tab===tab));
  // SỬA LỖI (mục R, v2026.8.17): trước đây CHỈ tải lại báo cáo nếu chưa
  // từng tải trong phiên làm việc (!state.tonkhoDamgoReport) - nên nếu
  // người dùng đã xem báo cáo 1 lần, rồi qua Lịch Sử sửa số liệu ngày đó,
  // rồi bấm lại tab này, vẫn hiện bản CŨ đã cache thay vì lấy lại dữ liệu
  // mới từ Chitiettonkho. LUÔN tải lại mỗi khi vào tab này để đảm bảo
  // luôn đúng dữ liệu mới nhất (chi phí gọi lại rất nhẹ - chỉ 1 ngày).
  if (tab === 'tonkhodamgo') loadTonkhoDamgoReport();
}

/** Đổi chế độ hiển thị "Theo thực tế" / "Đầy đủ số liệu" cho báo cáo
 * "Theo mẫu Tonkho_Damgo" (mục L) - tải lại báo cáo ngay theo chế độ mới. */
function switchTonkhoDamgoMode(mode){
  state.tonkhoDamgoMode = mode;
  document.querySelectorAll('.tkd-mode-btn').forEach(b => b.classList.toggle('primary', b.dataset.mode===mode));
  loadTonkhoDamgoReport();
}

/** Nút "Gửi báo cáo Telegram" (mục S, ở Trang chủ > Công cụ Admin) - gửi
 * ĐỘT XUẤT (ngoài lịch 16h tự động) 1 ẢNH tóm tắt Trang chủ (số liệu MỚI
 * NHẤT mỗi đơn vị, giống hệt đang xem trên màn hình) vào Telegram -
 * KHÔNG còn cần chọn ngày/chế độ như báo cáo Tonkho_Damgo trước đây. Chỉ
 * Admin thấy nút này (đã ẩn ở HTML qua class admin-only), nhưng vẫn
 * kiểm tra lại quyền ở server (guiBaoCaoTelegramTuWebApp) - không tin
 * riêng vào việc ẩn nút trên giao diện. */
function guiBaoCaoTelegramDotXuat(){
  // THEO YÊU CẦU MỚI (mục Y, v2026.8.17): cho Admin CHỌN NGÀY LẬP BÁO
  // CÁO trước khi gửi - đôi lúc cần gửi lại báo cáo của 1 ngày trước đó,
  // không phải ngày hiện tại. Chỉ truyền ngày lên server khi khác hôm
  // nay - để nguyên hôm nay = giữ nguyên hành vi gốc (số liệu mới nhất).
  const ngayChon = (document.getElementById('settings-tele-ngay')||{}).value || '';
  const laHomNay = !ngayChon || ngayChon === todayISO_();
  const ngayISO = laHomNay ? '' : ngayChon;
  const xacNhan = laHomNay
    ? 'Gửi ảnh báo cáo tồn kho (giống Trang chủ, số liệu mới nhất mỗi đơn vị) vào Telegram ngay bây giờ?'
    : `Gửi LẠI ảnh báo cáo tồn kho TÍNH ĐẾN NGÀY ${ngayChon} (không phải số liệu mới nhất) vào Telegram ngay bây giờ?`;
  if (!confirm(xacNhan)) return;
  call('guiBaoCaoTelegramTuWebApp', [ngayISO], 'Đang gửi báo cáo Telegram...').then(res => handleResult(res));
}

/** Nút "Gửi báo cáo Telegram" ở trang Báo Cáo > Theo mẫu Tonkho_Damgo
 * (mục U - KHÔI PHỤC LẠI mẫu gửi CŨ theo yêu cầu người dùng: 1 tin tóm
 * tắt dạng chữ + 2 file PDF, cho ĐÚNG ngày + chế độ đang xem trên màn
 * hình) - TÁCH BIỆT với guiBaoCaoTelegramDotXuat() ở Trang chủ (gửi ảnh,
 * không tham số). Chỉ Admin thấy nút này (class admin-only), nhưng vẫn
 * kiểm tra lại quyền ở server (guiBaoCaoTonkhoDamgoTelegramTuWebApp) -
 * không tin riêng vào việc ẩn nút trên giao diện. */
function guiBaoCaoTonkhoDamgoTelegramDotXuat(){
  const ngayISO = (document.getElementById('tkd-ngay')||{}).value || '';
  if (!ngayISO) { toast('Vui lòng chọn ngày báo cáo trước khi gửi.', 'warn'); return; }
  const mode = state.tonkhoDamgoMode === 'full' ? 'full' : 'actual';
  if (!confirm('Gửi báo cáo tồn kho ngày ' + ngayISO + ' (chế độ "' + (mode==='full'?'Đầy đủ số liệu':'Theo thực tế') + '", kèm 2 file PDF) vào Telegram ngay bây giờ?')) return;
  call('guiBaoCaoTonkhoDamgoTelegramTuWebApp', [ngayISO, mode], 'Đang gửi báo cáo Telegram...').then(res => handleResult(res));
}

function loadReport(){
  const donVi = document.getElementById('rp-donVi').value;
  const nhaMay = (document.getElementById('rp-nhaMay')||{}).value || '';
  const f = document.getElementById('rp-from').value, t = document.getElementById('rp-to').value;
  state.reportNhaMay = nhaMay;
  call('getReportSummary', [f, t, donVi], 'Đang tổng hợp báo cáo...').then(res => {
    state.reportRows = res;
    renderReportTable();
  });
  // THEO YÊU CẦU MỚI (mục V): tải kèm bảng chi tiết theo NGÀY, lọc được
  // theo Nhà máy - tách gọi riêng (không chung getReportSummary) vì đây
  // là dữ liệu chi tiết từng ngày, không gộp đầu/cuối kỳ.
  call('getNhaMayDetailReport', [f, t, donVi, nhaMay], null).then(res => {
    state.reportNhaMayDetail = res;
    renderNhaMayDetailTable();
  });
}

function renderReportTable(){
  const wrap = document.getElementById('report-wrap');
  const res = state.reportRows;
  if (!res || !res.rows.length) { wrap.innerHTML = '<div class="empty"><div class="ic">📭</div>Không có dữ liệu trong khoảng ngày này.</div>'; return; }
  const maxTon = Math.max(...res.rows.map(r=>r.tonCuoiKy), 1);

  // Bảng tổng quan (giữ như cũ, có thêm Cộng MT/BDMT cuối kỳ - THEO YÊU
  // CẦU MỚI v2026.8.6: trước đây thiếu, nhìn chỉ thấy số chung chung).
  const overviewHtml = `<table><thead><tr>
      <th>Đơn vị</th><th class="num">Số ngày đã báo cáo</th><th>Từ ngày</th><th>Đến ngày</th>
      <th class="num">Tồn đầu kỳ</th><th class="num">Tồn cuối kỳ</th>
      <th class="num">Cộng MT cuối kỳ</th><th class="num">Cộng BDMT cuối kỳ</th>
      <th class="num">Độ ẩm cuối kỳ</th>

    </tr></thead><tbody>

      <td>${esc(r.donVi)}<div class="bar-wrap"><div class="bar-fill" style="width:${Math.max(2,r.tonCuoiKy/maxTon*100)}%"></div></div></td>

      <td class="num">${fmtNum(r.tonDauKy)}</td><td class="num">${fmtNum(r.tonCuoiKy)}</td>
      <td class="num">${fmtNum(r.congMTCuoiKy)}</td><td class="num">${fmtNum(r.congBDMTCuoiKy)}</td>
      <td class="num">${fmtPct(r.doAmCuoiKy)}</td>
      <td class="num">${fmtNum(r.tongNhapGoTrongKy)}</td><td class="num">${fmtNum(r.tongMuonTraTrongKy)}</td>
    </tr>`).join('')}
    </tbody>
    <tfoot><tr><td colspan="5" style="text-align:right">TỔNG CỘNG</td>
      <td class="num">${fmtNum(res.tongTonCuoiKy)}</td>
      <td class="num">${fmtNum(res.total.congMTCuoiKy)}</td><td class="num">${fmtNum(res.total.congBDMTCuoiKy)}</td>
      <td></td>
      <td class="num">${fmtNum(res.tongNhapGoTrongKy)}</td><td></td></tr></tfoot>
    </table>`;

  // Chi tiết KHO NHÀ MÁY và KHO XUẤT HÀNG (Tiên Sa + Dung Quất), cuối
  // kỳ, đầy đủ MT/BDMT - THEO YÊU CẦU MỚI: báo cáo tổng hợp trước đây

  const wrap = document.getElementById('tkd-wrap');
  const res = state.tonkhoDamgoReport;
  if (!wrap) return;
  if (!res || !res.success) { wrap.innerHTML = `<div class="empty"><div class="ic">📭</div>${esc((res&&res.message)||'Không có dữ liệu.')}</div>`; return; }

  const t1cols = [
    {key:'hoaNhonMT',label:'Hòa Nhơn_MT'},{key:'queSonMT',label:'Quế Sơn_MT'},{key:'daiHiepMT',label:'Đại Hiệp_MT'},{key:'hakqnMT',label:'HAKQN_MT'},{key:'congMT',label:'Cộng MT'},
    {key:'hoaNhonBDMT',label:'Hòa Nhơn_BDMT'},{key:'queSonBDMT',label:'Quế Sơn_BDMT'},{key:'daiHiepBDMT',label:'Đại Hiệp_BDMT'},{key:'hakqnBDMT',label:'HAKQN_BDMT'},{key:'congBDMT',label:'Cộng BDMT'}
  ];
  const t2cols = [
    {key:'doAmHN',label:'Độ ẩm kho HN',pct:true},{key:'doAmQS',label:'Độ ẩm kho QS',pct:true},{key:'doAmDH',label:'Độ ẩm kho ĐH',pct:true},{key:'doAmQC',label:'Độ ẩm kho QC',pct:true},
    {key:'doAm',label:'Độ ẩm TB',pct:true},{key:'doKho',label:'Độ khô TB',pct:true}
  ];
  const t3cols = [
    {key:'tienSaMT',label:'Kho Tiên Sa_MT'},{key:'tienSaBDMT',label:'Kho Tiên Sa_BDMT'},{key:'doAmTienSa',label:'Độ ẩm_Tiên Sa',pct:true},{key:'doKhoTienSa',label:'Độ khô Tiên Sa',pct:true}
  ];
  const t3bcols = [
    {key:'dungQuatMT',label:'Kho Dung Quất_MT'},{key:'dungQuatBDMT',label:'Kho Dung Quất_BDMT'},{key:'doAmDungQuat',label:'Độ ẩm_Dung Quất',pct:true},{key:'doKhoDungQuat',label:'Độ khô Dung Quất',pct:true}
  ];
  const t4cols = [
    {key:'tonDauKy',label:'Tồn kho đầu kỳ'},{key:'tonCK',label:'Tồn kho CK'},{key:'muonTra',label:'Mượn/trả'},{key:'clDoAm',label:'CL độ ẩm'},{key:'nhapTrongKy',label:'Nhập trong kỳ MT'},{key:'dinhMuc',label:'Định mức',pct:true}
  ];

  const fmtCell = (c, v) => c.pct ? fmtPct(v) : fmtNum(v);
  const mkTable = (cols, rows, total) => `<table><thead><tr><th>Đơn vị</th>${cols.map(c=>`<th class="num">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.donVi)}</td>${cols.map(c=>`<td class="num">${fmtCell(c, r[c.key])}</td>`).join('')}</tr>`).join('')}
    <tr style="font-weight:700;background:var(--moss-light)"><td>Grand Total</td>${cols.map(c=>`<td class="num">${fmtCell(c, total[c.key])}</td>`).join('')}</tr>
    </tbody></table>`;

  // Ghi chú đơn vị chưa báo cáo đúng ngày (mục L) - nội dung khác nhau
  // tùy chế độ hiển thị: "actual" luôn báo hiển thị 0 (đúng thực trạng),
  // "full" tách riêng 2 trường hợp - đơn vị lấy được số liệu tạm (ghi rõ
  // lấy của ngày nào) và đơn vị CHƯA TỪNG có dữ liệu (vẫn phải hiển thị
  // 0 vì không có gì để lấy tạm).
  let missingHtml = '';
  if (res.missingUnits && res.missingUnits.length) {
    const detail = res.missingUnitsDetail || res.missingUnits.map(u => ({donVi: u, usedDate: null}));
    if (res.mode === 'full') {
      const withFallback = detail.filter(d => d.usedDate);
      const noFallback = detail.filter(d => !d.usedDate);
      if (withFallback.length) {
        const list = withFallback.map(d => `${esc(d.donVi)} (đang hiển thị số liệu ngày ${esc(d.usedDate)})`).join(', ');
        missingHtml += `<div class="hint-text" style="background:var(--timber-light);color:#8C511F;padding:10px 12px;border-radius:8px;margin:0 0 10px 0">⚠️ Chưa có dữ liệu Chitiettonkho cho ngày ${esc(res.ngayDisplay)} ở đơn vị: ${list} - các dòng tương ứng đang hiển thị số liệu của ngày gần nhất trước đó (chế độ "Đầy đủ số liệu").</div>`;
      }
      if (noFallback.length) {
        missingHtml += `<div class="hint-text" style="background:var(--danger-light);color:var(--danger);padding:10px 12px;border-radius:8px;margin:0 0 14px 0">⚠️ Đơn vị: ${noFallback.map(d=>esc(d.donVi)).join(', ')} CHƯA TỪNG có dữ liệu Chitiettonkho trước ngày ${esc(res.ngayDisplay)} - các dòng tương ứng đang hiển thị 0.</div>`;
      }
    } else {
      missingHtml = `<div class="hint-text" style="background:var(--timber-light);color:#8C511F;padding:10px 12px;border-radius:8px;margin:0 0 14px 0">⚠️ Chưa có dữ liệu Chitiettonkho cho ngày ${esc(res.ngayDisplay)} ở đơn vị: ${res.missingUnits.map(esc).join(', ')} - các dòng tương ứng đang hiển thị 0.</div>`;
    }
  }

  wrap.innerHTML = `
    <div style="font-weight:700;font-size:14px;margin-bottom:14px">Ngày ${esc(res.ngayDisplay)}</div>
    ${missingHtml}
    <div style="color:var(--danger);font-weight:700;text-transform:uppercase;font-size:13px;margin:4px 0 8px 0">NHÀ MÁY</div>
    <div style="overflow-x:auto">${mkTable(t1cols, res.table1, res.table1Total)}</div>
    <div style="overflow-x:auto;margin-top:18px">${mkTable(t2cols, res.table2, res.table2Total)}</div>
    <div style="color:var(--danger);font-weight:700;text-transform:uppercase;font-size:13px;margin:26px 0 8px 0">KHO XUẤT HÀNG</div>
    <div style="font-weight:600;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px">Kho Tiên Sa</div>
    <div style="overflow-x:auto">${mkTable(t3cols, res.table3, res.table3Total)}</div>
    <div style="font-weight:600;font-size:12.5px;color:var(--ink-soft);margin:18px 0 6px 0">Kho Dung Quất</div>
    <div style="overflow-x:auto">${mkTable(t3bcols, res.table3b, res.table3bTotal)}</div>
    <div style="color:var(--danger);font-weight:700;text-transform:uppercase;font-size:13px;margin:26px 0 8px 0">ĐỊNH MỨC SX</div>
    <div style="overflow-x:auto">${mkTable(t4cols, res.table4, res.table4Total)}</div>
  `;
}

/* ------------------------------------------------------------
 * XUẤT EXCEL / PDF CHO BÁO CÁO TỔNG HỢP
 * THEO YÊU CẦU MỚI (v2026.8.11, sửa lại v2026.8.17): cả 2 tab của trang
 * Báo Cáo (theo khoảng thời gian + theo mẫu Tonkho_Damgo) đều xuất được
 * ra Excel và PDF, xuất đúng dữ liệu/bảng đang hiển thị trên màn hình
 * theo bộ lọc hiện tại.
 * - Excel (SỬA LỖI v2026.8.17): trước đây dùng thư viện SheetJS tải từ
 *   CDN ngoài (cdnjs.cloudflare.com) - người dùng báo "không kết xuất
 *   Excel được", nhiều khả năng do mạng/trình duyệt/chính sách công ty
 *   chặn tải script từ CDN ngoài (ứng dụng chạy trong iframe của Apps
 *   Script, phụ thuộc mạng của người dùng, không kiểm soát được). SỬA:
 *   bỏ HẲN phụ thuộc CDN ngoài - tự dựng file Excel (.xls, định dạng
 *   HTML đặc biệt Excel hiểu được, NHIỀU SHEET thật dùng namespace
 *   "urn:schemas-microsoft-com:office:excel" chuẩn của Microsoft) hoàn
 *   toàn bằng JavaScript thuần ngay trong trình duyệt - xem
 *   xuatBangHtmlThanhExcel_() ngay dưới đây - không cần tải bất kỳ thư
 *   viện ngoài nào nữa, luôn hoạt động bất kể mạng.
 * - PDF: không dùng thư viện tạo PDF riêng (jsPDF mặc định không hiển
 *   thị đúng dấu tiếng Việt nếu không nhúng thêm font) mà tận dụng hộp
 *   thoại "In" có sẵn của trình duyệt (window.print), ẩn hết
 *   sidebar/topbar/bộ lọc, chỉ để lại đúng bảng kết quả rồi cho người
 *   dùng chọn "Lưu dưới dạng PDF" - vừa nhẹ vừa hiển thị tiếng Việt
 *   chuẩn. KHỔ NGANG (landscape) đặt làm mặc định (xem @page trong
 *   @media print) vì các bảng nhiều cột (Kho Nhà máy...) hay bị tràn/cắt
 *   cột khi in khổ dọc.
 * ------------------------------------------------------------ */

/** Dựng + tải về 1 file Excel (.xls) nhiều sheet THẬT (mở ra có nhiều
 * tab riêng biệt, không phải gộp chung 1 trang) từ danh sách <table>
 * HTML đang hiển thị - KHÔNG cần thư viện ngoài (mục V, v2026.8.17).
 * Kỹ thuật: file .xls thực chất là 1 trang HTML đặc biệt kèm khối XML
 * "mso-application" khai báo tên từng sheet (x:ExcelWorksheet) - đây là
 * định dạng CHÍNH THỨC Microsoft công bố để tạo file Excel từ HTML,
 * KHÔNG phải mẹo/hack không chính thức. Excel khi mở sẽ hiện cảnh báo
 * nhỏ "định dạng và phần mở rộng không khớp" (vì thực chất là HTML, không
 * phải file .xlsx nhị phân) - đây là hành vi Excel BÌNH THƯỜNG với loại
 * file này, chỉ cần bấm "Yes/Có" là mở được, không ảnh hưởng dữ liệu. */
function xuatBangHtmlThanhExcel_(tables, sheetNames, fileNamePrefix){
  const safeName = (s, i) => String(s || `Bang ${i+1}`).replace(/[\\\/\?\*\[\]:]/g, ' ').trim().slice(0, 31) || `Sheet${i+1}`;
  const names = Array.from(tables).map((_, i) => safeName(sheetNames[i], i));
  const worksheetsXml = names.map(n => `<x:ExcelWorksheet><x:Name>${esc(n)}</x:Name><x:WorksheetOptions><x:Panes/><x:ProtectObjects>False</x:ProtectObjects><x:ProtectScenarios>False</x:ProtectScenarios></x:WorksheetOptions></x:ExcelWorksheet>`).join('');
  const bodyHtml = Array.from(tables).map((tbl, i) => `<div id="${esc(names[i])}">${tbl.outerHTML}</div>`).join('\n');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${worksheetsXml}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px} td,th{border:1px solid #999;padding:4px 6px}</style>
</head><body>${bodyHtml}</body></html>`;
  const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${fileNamePrefix}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function exportReportToExcel(){
  let wrap, sheetNames, fileNamePrefix;
  if (state.reportTab === 'tonkhodamgo') {
    wrap = document.getElementById('tkd-wrap');
    sheetNames = ['Nha may (MT-BDMT)', 'Do am', 'Kho Tien Sa', 'Kho Dung Quat', 'Dinh muc'];
    const modeSuffix = state.tonkhoDamgoMode === 'full' ? 'DayDuSoLieu' : 'ThucTe';
    fileNamePrefix = `BaoCao_TonkhoDamgo_${state.tonkhoDamgoDate || ''}_${modeSuffix}`;
  } else {
    wrap = document.getElementById('report-wrap');
    sheetNames = ['Tong quan', 'Kho Nha may', 'Kho Xuat hang', 'Chi tiet theo Nha may'];
    const f = (document.getElementById('rp-from')||{}).value || '';
    const t = (document.getElementById('rp-to')||{}).value || '';
    fileNamePrefix = `BaoCao_TongHop_${f}_${t}`;
  }
  const tables = wrap ? wrap.querySelectorAll('table') : [];
  if (!tables.length) { toast('Chưa có dữ liệu báo cáo để xuất - vui lòng bấm "Xem báo cáo" trước.', 'warn'); return; }
  xuatBangHtmlThanhExcel_(tables, sheetNames, fileNamePrefix);
}

function exportReportToPdf(){
  const wrap = document.getElementById(state.reportTab === 'tonkhodamgo' ? 'tkd-wrap' : 'report-wrap');
  if (!wrap || !wrap.querySelector('table')) { toast('Chưa có dữ liệu báo cáo để xuất - vui lòng bấm "Xem báo cáo" trước.', 'warn'); return; }
  document.body.classList.add('printing-report');
  const cleanup = () => document.body.classList.remove('printing-report');
  window.onafterprint = cleanup;
  window.print();
  // Dự phòng cho trình duyệt không bắn sự kiện onafterprint (hiếm gặp) -
  // để thời gian đủ dài (2 phút) tránh gỡ class khi hộp thoại In vẫn
  // đang mở (một số trình duyệt cập nhật preview theo thời gian thực).
  setTimeout(cleanup, 120000);
}

/** Màn hình CHẶN HẲN khi email chưa được Admin cấp quyền gì (mục X,
 * v2026.8.17) - thay toàn bộ nội dung + ẩn sidebar/topbar, KHÔNG cho
 * dùng bất kỳ trang nào của Web App (kể cả Xem) cho tới khi được cấp
 * quyền. Đây là hành vi ĐÃ THỐNG NHẤT với người dùng (mặc định chặn,
 * không mở - an toàn hơn cho dữ liệu tồn kho). */
function renderBlockedAccess_(email){
  const sidebar = document.querySelector('.sidebar');
  const topbar = document.querySelector('.topbar');
  if (sidebar) sidebar.style.display = 'none';
  if (topbar) topbar.style.display = 'none';
  // THEO YÊU CẦU MỚI (mục AB, v2026.8.17): nếu server KHÔNG lấy được
  // email (Session.getActiveUser().getEmail() trả về rỗng - thường do
  // deploy "Ai có quyền truy cập" = "Bất kỳ ai" (không bắt đăng nhập)
  // hoặc do trình duyệt chưa đăng nhập/chưa cấp quyền chia sẻ email cho
  // script), tách riêng thông báo này khỏi trường hợp "có email nhưng
  // chưa được cấp Phân quyền" - tránh Admin tưởng nhầm là lỗi Phân
  // quyền rồi loay hoay thêm dòng mà không có tác dụng.
  if (!email) {
    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:560px;margin:60px auto;text-align:center">
        <div style="font-size:40px;margin-bottom:10px">⚠️</div>
        <h3>Không xác định được email đăng nhập</h3>
        <p class="hint-text">Web App không lấy được email Google của bạn, nên KHÔNG PHẢI lỗi "chưa được cấp Phân quyền". Nguyên nhân thường gặp:</p>
        <p class="hint-text" style="text-align:left">
          1) Trong Apps Script &gt; Deploy &gt; Manage deployments, mục "Ai có quyền truy cập" đang để "Bất kỳ ai" (Anyone) - cần đổi thành "Bất kỳ ai có Tài khoản Google" (Anyone with Google account) để bắt buộc đăng nhập.<br>
          2) Trình duyệt đang chưa đăng nhập Google, hoặc đăng nhập nhiều tài khoản gây nhầm lẫn - thử mở lại đường dẫn Web App ở cửa sổ ẩn danh rồi đăng nhập đúng 1 tài khoản.<br>
          3) Sau khi đổi cấu hình/deploy phiên bản mới, cần bấm "New deployment" (hoặc thêm phiên bản mới cho deployment cũ) rồi mở lại link, có thể cần cấp quyền (Authorize) lại lần đầu.
        </p>
        <p class="hint-text">Sau khi sửa xong, tải lại trang này. Nếu vẫn gặp lỗi, liên hệ người phụ trách kỹ thuật.</p>
      </div>`;
    return;
  }
  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:520px;margin:60px auto;text-align:center">
      <div style="font-size:40px;margin-bottom:10px">🔒</div>
      <h3>Bạn chưa được cấp quyền sử dụng hệ thống</h3>
      <p class="hint-text">Email <b>${esc(email)}</b> chưa được Admin cấp quyền cho bất kỳ Đơn vị nào (Nhập/Sửa hoặc Xem). Vui lòng liên hệ Admin để được thêm vào danh sách Phân quyền (Cài đặt &gt; Phân quyền).</p>
    </div>`;
}

/* ============================================================
 * INIT
 * ============================================================ */
call('getMyAccess', [], null).then(access => {
  state.myAccess = access;
  state.isAdmin = access.isAdmin;
  applyAdminUI();

  // THEO YÊU CẦU MỚI (mục X, v2026.8.17): email chưa được cấp quyền gì
  // (và không phải Admin) bị chặn hẳn - không mở được trang nào.
  if (!access.isAdmin && !access.coQuyenGi) {
    renderBlockedAccess_(access.email);
    return;
  }

  call('getUnitList', [], null).then(list => { state.units = list; });
  loadSoLuongChoDuyet();
  goTo('dashboard');
});
</script>
